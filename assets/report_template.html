<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport d'analyse créative — Data Détective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FC;--card:#FFFFFF;--blue:#1126FF;--blue-dark:#0E0484;--blue-meta:#0082FB;
  --orange:#F96521;--green:#22C55E;--yellow:#FFAF14;--grey:#94A3B8;--grey-light:#CBD5E1;
  --ink:#0B1020;--ink-soft:#475069;--line:#E7EAF3;
  --shadow:0 1px 2px rgba(11,16,32,.04),0 8px 24px rgba(11,16,32,.06);--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding:28px 22px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.meta-badge{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px}
.meta-badge span{font-weight:700;font-size:13px;color:var(--ink-soft)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--blue-dark)}
h1 .accent{color:var(--blue)}
.subhead{font-size:13.5px;color:var(--ink-soft);font-weight:500;margin-top:3px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;font-family:inherit;font-weight:600;font-size:13px;color:var(--ink-soft);padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.tabs{display:flex;gap:6px;margin:6px 0 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:transparent;font-family:inherit;font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:12px 16px;cursor:pointer;position:relative;letter-spacing:-.01em}
.tab.on{color:var(--blue-dark)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--blue);border-radius:3px}
.tab .dot{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;font-size:11px;font-weight:800;background:var(--bg);color:var(--ink-soft);border-radius:20px;padding:0 6px;margin-left:7px}
.tab.on .dot{background:var(--blue);color:#fff}
.panel{display:none}.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi.lead{background:var(--blue);border-color:var(--blue)}
.kpi .lab{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.kpi.lead .lab{color:rgba(255,255,255,.8)}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi.lead .val{color:#fff}
.kpi .sub{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:3px}
.kpi.lead .sub{color:rgba(255,255,255,.85)}
.delta{display:block;font-size:12px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.delta .dlab{font-weight:600;color:var(--ink-soft);font-size:11px}
.kpi.lead .delta .dlab{color:rgba(255,255,255,.7)}
.kpi .ref{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);background:#EEF1FF;border-radius:6px;padding:2px 7px;margin-top:6px}
.secbar{display:flex;flex-wrap:wrap;gap:22px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 20px;box-shadow:var(--shadow);margin-bottom:20px}
.secbar div{font-size:13px;color:var(--ink-soft);font-weight:600}
.secbar b{color:var(--ink);font-weight:800;font-size:15px;margin-left:4px}
.section-title{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--blue-dark);margin:24px 0 12px;display:flex;align-items:center;gap:9px}
.section-title small{font-weight:600;font-size:12.5px;color:var(--ink-soft)}
.chartcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.chartcard .ch-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.chartcard h3{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.metricsel{display:inline-flex;gap:5px;flex-wrap:wrap}
.metricsel button{border:1px solid var(--line);background:#fff;font-family:inherit;font-weight:600;font-size:12px;color:var(--ink-soft);padding:6px 11px;border-radius:8px;cursor:pointer}
.metricsel button.on{background:var(--blue-dark);color:#fff;border-color:var(--blue-dark)}
.gransel{display:inline-flex;gap:5px}
.gransel button{border:1px solid var(--line);background:#fff;font-family:inherit;font-weight:600;font-size:12px;color:var(--ink-soft);padding:6px 11px;border-radius:8px;cursor:pointer}
.gransel button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.gransel button.dis{opacity:.4;cursor:not-allowed}
.selobj{border:1px solid var(--line);background:#fff;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--ink);padding:7px 12px;border-radius:9px;cursor:pointer}
/* funnel pipeline */
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pipe .blk{border-radius:14px;padding:18px 20px;color:#fff;position:relative;overflow:hidden}
.pipe .noto{background:linear-gradient(135deg,#0082FB,#1126FF)}
.pipe .acq{background:linear-gradient(135deg,#1126FF,#0E0484)}
.pipe .rtg{background:linear-gradient(135deg,#0E0484,#080234)}
.pipe .pl{font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.pipe .pv{font-size:24px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.pipe .pr{font-size:12.5px;opacity:.9;font-weight:600}
.pipe .pc{font-size:11.5px;opacity:.8;font-weight:500;margin-top:6px}
.pipe .pc b{font-weight:800;opacity:1}
/* distribution */
.distbars{display:flex;align-items:flex-end;gap:26px;height:170px;padding:0 10px}
.distbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.distbar .bar{width:100%;max-width:74px;border-radius:9px 9px 0 0;transition:height .4s ease;min-height:4px}
.distbar .bn{font-size:13px;font-weight:700;margin-top:9px}
.distbar .bc{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:6px}
/* scatter */
.scatter-wrap{position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin:10px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
/* table */
.tablecard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-weight:700;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:12px;border-bottom:1px solid var(--line);background:#FBFCFE;white-space:nowrap}
thead th.num{text-align:right;cursor:pointer;user-select:none}
thead th.num:hover{color:var(--blue)}
thead th .ar{opacity:.4;font-size:10px}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.crow{cursor:pointer}
tbody tr.crow:hover{background:#FBFCFE}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.creacell{display:flex;align-items:center;gap:11px;min-width:220px}
.thumb{width:44px;height:44px;flex:0 0 44px;border-radius:9px;overflow:hidden;position:relative;background:#EEF1FA;border:1px solid var(--line)}
.fmt-ic{position:absolute;right:3px;bottom:3px;width:15px;height:15px;border-radius:5px;background:rgba(11,16,32,.72);display:flex;align-items:center;justify-content:center}
.cname{font-weight:700;font-size:12.5px;color:var(--ink);line-height:1.25}
.cmeta{font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clink{font-size:11px;font-weight:700;color:var(--blue);text-decoration:none;white-space:nowrap}
.clink:hover{text-decoration:underline}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.b-winner{background:#DCFCE7;color:#15803D}.b-improve{background:#E0E7FF;color:#3730D8}
.b-neutral{background:#F1F5F9;color:#64748B}.b-flop{background:#FFE4D6;color:#C2410C}
.b-learn{background:#F8FAFC;color:#94A3B8;border:1px dashed var(--grey-light)}
.fatigue{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.fat-yes{color:var(--orange)}.fat-no{color:var(--green)}.fat-na{color:var(--grey)}
.detail{display:none;background:#FBFCFE}.detail.on{display:table-row}
.detail td{padding:0 12px 16px}
.detailbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcell{background:#F8FAFC;border-radius:10px;padding:9px 11px}
.mcell .ml{font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.mcell .mv{font-size:15px;font-weight:800;color:var(--ink);margin-top:2px}
/* recos */
.reco{display:flex;gap:13px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:10px}
.reco .pri{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.reco .ac{font-size:13.5px;font-weight:500;color:var(--ink)}
.reco .ac b{font-weight:800;color:var(--blue-dark)}
.cta{background:var(--blue-dark);border-radius:20px;padding:30px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:30px}
.cta .ct{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.02em}
.cta .cs{font-size:13.5px;color:rgba(255,255,255,.8);font-weight:500;margin-top:4px;max-width:470px}
.cta a{background:var(--orange);color:#fff;text-decoration:none;font-weight:800;font-size:14.5px;padding:14px 24px;border-radius:12px;white-space:nowrap}
.foot{text-align:center;font-size:12px;color:var(--grey);font-weight:500;margin-top:26px}
@media(max-width:820px){.kpis,.mgrid{grid-template-columns:repeat(2,1fr)}.pipe{grid-template-columns:1fr}.detailbox{grid-template-columns:1fr}h1{font-size:22px}.distbars{gap:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="meta-badge">
        <svg width="18" height="18" viewBox="0 0 36 36"><path fill="#0082FB" d="M18 2C9.16 2 2 9.16 2 18c0 7.98 5.84 14.6 13.48 15.8V22.62h-4.06V18h4.06v-3.52c0-4.01 2.39-6.22 6.04-6.22 1.75 0 3.58.31 3.58.31v3.94h-2.02c-1.99 0-2.61 1.24-2.61 2.5V18h4.44l-.71 4.62h-3.73V33.8C28.16 32.6 34 25.98 34 18 34 9.16 26.84 2 18 2z"/></svg>
        <span>Meta Ads</span>
      </div>
      <h1>Rapport d'analyse <span class="accent">créative</span></h1>
      <div class="subhead">/*__SUBHEAD__*/</div>
    </div>
    <div class="seg" id="periodSeg">
      <button data-p="7">7 j</button><button data-p="14">14 j</button><button data-p="30">30 j</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel on" data-panel="overview" id="p-overview"></div>
  <div class="panel" data-panel="acq" id="p-acq"></div>
  <div class="panel" data-panel="noto" id="p-noto"></div>
  <div class="panel" data-panel="rtg" id="p-rtg"></div>

  <div class="foot">Rapport généré avec le template Data Détective · les seuils affichés sont des seuils par défaut, calibrables par compte</div>
</div>

<script>
/* ============ DONNÉES (le skill remplace ces blocs) ============ */
/* Datasets par période (7/14/30). Peut ne contenir qu'une seule période. */
const CREAS_BY_PERIOD = /*__CREAS_DATA__*/{"30":[]};
/* Périodes réellement fournies, triées ; période par défaut = la plus longue dispo */
const PERIODS_AVAIL = Object.keys(CREAS_BY_PERIOD).map(Number).sort((a,b)=>a-b);
let CURRENT_PERIOD = PERIODS_AVAIL.length ? PERIODS_AVAIL[PERIODS_AVAIL.length-1] : 30;
let CREAS = CREAS_BY_PERIOD[String(CURRENT_PERIOD)] || [];
/* Recommandations injectées (overview + par objectif). Chaque reco : {p:int, c:"var(--…)", t:"html"} */
const RECOS = /*__RECOS_DATA__*/{overview:[],acq:[],noto:[],rtg:[]};
/* Deltas "vs préc." injectés par bloc. null = masqué (jamais inventé). */
const DELTAS = /*__DELTAS_DATA__*/{overview:null,acq:null,noto:null,rtg:null};
function dget(block,key){const b=DELTAS&&DELTAS[block];return b&&b[key]!=null?b[key]:null;}
function recoHtml(list){return (list||[]).map(r=>`<div class="reco"><div class="pri" style="background:${r.c}">${r.p}</div><div class="ac">${r.t}</div></div>`).join('');}

/* Config par objectif : KPI de référence, métriques temporelles, recos */
const OBJ = {
  acq:{label:"Acquisition",refKey:"cac",refLabel:"CAC moyen",yLabel:"CAC (€)",yKey:"cac",lowerBetter:true,
    metrics:[{k:"spend",l:"Dépense",u:"€"},{k:"cac",l:"CAC",u:"€"},{k:"roas",l:"ROAS",u:""},{k:"conv",l:"Conversions",u:""},{k:"ctr",l:"CTR",u:"%"},{k:"cpc",l:"CPC",u:"€"}]},
  noto:{label:"Notoriété",refKey:"cpm",refLabel:"CPM moyen",yLabel:"CPM (€)",yKey:"cpm",lowerBetter:true,
    metrics:[{k:"cpm",l:"CPM",u:"€"},{k:"freq",l:"Fréquence",u:""},{k:"ctr",l:"CTR",u:"%"},{k:"hook",l:"Hook rate",u:"%"},{k:"spend",l:"Dépense",u:"€"}]},
  rtg:{label:"Retargeting",refKey:"cac",refLabel:"CAC moyen",yLabel:"CAC (€)",yKey:"cac",lowerBetter:true,
    scatterKey:"cvr",scatterYLabel:"Taux de conv. (%)",scatterRefLabel:"Taux de conv. moyen",scatterHigherBetter:true,
    metrics:[{k:"spend",l:"Dépense",u:"€"},{k:"cac",l:"CAC",u:"€"},{k:"cvr",l:"Taux de conv.",u:"%"},{k:"aov",l:"AOV",u:"€"},{k:"cpc",l:"CPC",u:"€"}]}
};

const CAT = {
  winner:{label:"Winner",cls:"b-winner",color:"#22C55E",tip:"CAC / CPM sous le seuil de référence ET forte diffusion. La créative performe et l'algorithme la pousse."},
  improve:{label:"Improve",cls:"b-improve",color:"#1126FF",tip:"Sous le seuil mais diffusion moyenne. Potentiel à scaler si la fatigue ne s'installe pas."},
  neutral:{label:"Neutral",cls:"b-neutral",color:"#94A3B8",tip:"Diffusion faible ou signal insuffisant pour trancher."},
  flop:{label:"Flop",cls:"b-flop",color:"#F96521",tip:"Coût qui dépasse largement la moyenne, ou dépense sans conversion. Coupure recommandée."},
  learn:{label:"Apprentissage",cls:"b-learn",color:"#CBD5E1",tip:"Moins de 96 h d'activité : non catégorisée. La date de lancement est un KPI, on ne juge pas une créative trop jeune."}
};
const FMT_ICON={video:'<path d="M8 5v14l11-7z" fill="#fff"/>',image:'<path d="M4 5h16v14H4z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="9" cy="10" r="1.6" fill="#fff"/><path d="M6 17l4-4 3 3 3-3 2 2" stroke="#fff" stroke-width="1.6" fill="none"/>',carousel:'<rect x="6" y="5" width="12" height="14" rx="1.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 8v8M21 8v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'};
const THUMB_GRAD={video:["#0082FB","#1126FF"],image:["#7C9BF5","#4B63D8"],carousel:["#F96521","#FF9558"]};
const FMT_LABEL={video:"Vidéo",image:"Image",carousel:"Carrousel"};

/* ---------- helpers ---------- */
const eur=n=>n==null?"—":n.toLocaleString('fr-FR',{maximumFractionDigits:n<100?1:0})+" €";
const dec=n=>n==null?"—":n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const ageTxt=d=>d<1?"<1 j":d+" j";
function rndSeed(str,s){let seed=s||0;for(const c of str)seed=(seed*31+c.charCodeAt(0))%99991;return()=>{seed=(seed*1103515245+12345)&0x7fffffff;return(seed%1000)/1000;};}

function aggr(list){
  const spend=list.reduce((s,c)=>s+c.spend,0);
  const conv=list.reduce((s,c)=>s+(c.conv||0),0);
  const imp=list.reduce((s,c)=>s+c.spend/c.cpm*1000,0);
  const cac=conv?spend/conv:null;
  const cval=list.reduce((s,c)=>s+(c.roas?c.roas*c.spend:0),0);
  const roas=spend?cval/spend:null;
  const cpm=imp?spend/imp*1000:null;
  const winners=list.filter(c=>c.cat==="winner").length;
  return {spend,conv,cac,roas,cpm,winners,count:list.length,cval};
}

function thumb(c){
  const g=THUMB_GRAD[c.fmt],id="g"+Math.random().toString(36).slice(2,7);
  return `<div class="thumb"><svg viewBox="0 0 44 44"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient></defs><rect width="44" height="44" fill="url(#${id})"/><g transform="translate(14 13) scale(0.62)" opacity="0.9">${FMT_ICON[c.fmt]}</g></svg><div class="fmt-ic"><svg width="10" height="10" viewBox="0 0 24 24">${FMT_ICON[c.fmt]}</svg></div></div>`;
}
function sparkline(c){
  const rnd=rndSeed(c.name,3),n=14,pts=[];let base=c.spend/n;
  for(let i=0;i<n;i++){const drift=c.fatigue?1-(i/n)*0.5:(c.cat==="winner"?1+(i/n)*0.15:1);pts.push(base*drift*(0.75+rnd()*0.5));}
  const max=Math.max(...pts),min=Math.min(...pts),W=110,H=38;
  const x=i=>i/(n-1)*W,y=v=>H-4-((v-min)/(max-min||1))*(H-8);
  let d="M"+x(0)+","+y(pts[0]);pts.forEach((v,i)=>{if(i)d+="L"+x(i)+","+y(v)});
  const col=c.fatigue?"#F96521":"#0082FB",id="s"+Math.random().toString(36).slice(2,7);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity="0.25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W},${H}L0,${H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/></svg>`;
}
function fatigueChart(c){
  const rnd=rndSeed(c.name,7),n=14,W=440,H=170,pad=28,spend=[],cac=[];let bs=c.spend/n,bc=c.cac||50;
  for(let i=0;i<n;i++){const df=c.fatigue?1-(i/n)*0.55:(c.cat==="winner"?1+(i/n)*0.12:1);spend.push(bs*df*(0.8+rnd()*0.4));cac.push(bc*(c.fatigue?1+(i/n)*0.6:1)*(0.9+rnd()*0.2));}
  const sMax=Math.max(...spend),cMax=Math.max(...cac),cMin=Math.min(...cac);
  const x=i=>pad+i/(n-1)*(W-pad*1.4),ys=v=>H-pad-(v/sMax)*(H-pad*1.8),yc=v=>H-pad-((v-cMin)/(cMax-cMin||1))*(H-pad*1.8);
  let sd="M"+x(0)+","+ys(spend[0]);spend.forEach((v,i)=>{if(i)sd+="L"+x(i)+","+ys(v)});
  let cd="M"+x(0)+","+yc(cac[0]);cac.forEach((v,i)=>{if(i)cd+="L"+x(i)+","+yc(v)});
  const id="f"+Math.random().toString(36).slice(2,7),hasCac=c.cac!=null;

/* ---------- scatter dépense × efficacité ---------- */
function scatter(list,cfg){
  const W=880,H=340,padL=56,padB=44,padT=18,padR=16;
  // axe Y : par défaut yKey (cac/cpm). Si scatterKey défini (RTG -> cvr), on l'utilise.
  const yKey=cfg.scatterKey||cfg.yKey;
  const yLabel=cfg.scatterYLabel||cfg.yLabel;
  const refLabelFull=cfg.scatterRefLabel||cfg.refLabel;
  const higherBetter=!!cfg.scatterHigherBetter;
  const valid=list.filter(c=>c[yKey]!=null);
  const xs=list.map(c=>c.spend),ys=valid.map(c=>c[yKey]);
  const xMax=Math.max(...xs)*1.1,yMax=Math.max(...ys)*1.15,yMin=0;
  // référence = moyenne pondérée du périmètre pour cette métrique
  let ref;
  if(yKey==="cvr"){const conv=list.reduce((s,c)=>s+(c.conv||0),0);const clicks=list.reduce((s,c)=>s+c.spend/c.cpc,0);ref=conv/clicks*100;}
  else if(yKey==="cpm"){const imp=list.reduce((s,c)=>s+c.spend/c.cpm*1000,0);ref=list.reduce((s,c)=>s+c.spend,0)/imp*1000;}
  else {const conv=list.reduce((s,c)=>s+(c.conv||0),0);ref=list.reduce((s,c)=>s+c.spend,0)/conv;}
  const X=v=>padL+v/xMax*(W-padL-padR);
  const Y=v=>H-padB-((v-yMin)/(yMax-yMin))*(H-padB-padT);
  const sizes=list.map(c=>c.obj==="noto"?(c.spend/c.cpm*1000):(c.conv||1));
  const sMax=Math.max(...sizes);
  const r=v=>6+Math.sqrt(v/sMax)*20;
  const unitY=yKey==="cvr"?"%":"€";
  const fmtY=v=>unitY==="%"?dec(v)+" %":eur(v);
  // grille Y + valeurs d'axe
  let grid="";
  for(let k=0;k<=4;k++){const gy=padT+(k/4)*(H-padB-padT);const gv=yMax-(k/4)*(yMax-yMin);grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#F1F5F9"/><text x="${padL-8}" y="${gy+3}" font-size="10" fill="#94A3B8" text-anchor="end">${unitY==="%"?dec(gv)+" %":Math.round(gv)+" €"}</text>`;}
  // graduations X (dépense)
  let xlab="";for(let k=0;k<=4;k++){const gv=(k/4)*xMax;const gx=X(gv);xlab+=`<text x="${gx}" y="${H-14}" font-size="10" fill="#94A3B8" text-anchor="middle">${Math.round(gv)} €</text>`;}
  // bulles avec tooltip nom + valeurs des deux axes
  let pts="";
  valid.forEach(c=>{
    const col=CAT[c.cat].color,cx=X(c.spend),cy=Y(c[yKey]),rad=r(c.obj==="noto"?(c.spend/c.cpm*1000):(c.conv||1));
    const yval=fmtY(c[yKey]);
    pts+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${col}" fill-opacity="0.6" stroke="${col}" stroke-width="1.5"><title>${c.name}\nDépense : ${eur(c.spend)}\n${yLabel.replace(/ \(.*\)/,'')} : ${yval}\n${c.obj==="noto"?"Impressions":"Conversions"} : ${c.obj==="noto"?Math.round(c.spend/c.cpm*1000).toLocaleString('fr-FR'):c.conv}</title></circle>`;
  });
  const refY=Y(ref);
  const refLine=(ref<=yMax&&ref>=yMin)?`<line x1="${padL}" y1="${refY}" x2="${W-padR}" y2="${refY}" stroke="#0E0484" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-padR}" y="${refY-6}" font-size="11" font-weight="700" fill="#0E0484" text-anchor="end">${refLabelFull} ${fmtY(ref)}</text>`:"";
  const senseTag=`<text x="${padL}" y="${padT-4}" font-size="10.5" font-weight="700" fill="${higherBetter?'#15803D':'#C2410C'}">${higherBetter?'▲ plus haut = mieux':'▼ plus bas = mieux'}</text>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}">${grid}${refLine}<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#E7EAF3"/><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#E7EAF3"/>${senseTag}<text x="${W-padR}" y="${H-28}" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="end">Dépense →</text><text x="${padL-46}" y="${padT+6}" font-size="11" font-weight="600" fill="#94A3B8">${yLabel}</text>${pts}${xlab}</svg>`;
}

/* ---------- courbe temporelle avec sélecteur ---------- */
const GRAN={day:{n:14,step:1,lab:i=>{const d=new Date();d.setDate(d.getDate()-(13-i));return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});}},
  week:{n:8,step:7,lab:i=>"S"+(i+1)},
  month:{n:4,step:30,lab:i=>{const m=["Avr","Mai","Juin","Juil","Août","Sept","Oct"];return m[i]||("M"+(i+1));}}};
function timeSeries(obj,mk,gran){
  const g=GRAN[gran||"day"],rnd=rndSeed(obj+mk+gran,11),n=g.n,pts=[];
  const bases={spend:1400,cac:52,roas:2.8,conv:26,ctr:1.5,cpc:0.8,cpm:11,freq:2.3,hook:26,cvr:6,aov:130};
  let b=bases[mk]||10;
  const mult=gran==="week"?7:(gran==="month"?30:1);
  const cumul=(mk==="spend"||mk==="conv"); // ces métriques s'additionnent sur la granularité
  for(let i=0;i<n;i++){const t=(mk==="cac"||mk==="cpm"||mk==="freq")?1+(i/n)*0.15:(mk==="roas"?1-(i/n)*0.05:1);let v=b*t*(0.82+rnd()*0.36);if(cumul)v*=mult;pts.push(v);}
  return pts;
}
function fmtVal(v,unit){return unit==="€"?eur(v):(unit==="%"?dec(v)+" %":dec(v));}
function timeChart(obj,mk,unit,gran){
  gran=gran||"day";const g=GRAN[gran];const pts=timeSeries(obj,mk,gran),n=pts.length,W=880,H=230,padL=54,padB=34,padT=16,padR=14;
  const max=Math.max(...pts),min=Math.min(...pts),span=(max-min)||1;
  const x=i=>padL+i/(n-1)*(W-padL-padR),y=v=>H-padB-((v-min)/span)*(H-padB-padT);
  // grille Y + valeurs
  let grid="";for(let k=0;k<=4;k++){const gy=padT+(k/4)*(H-padB-padT);const gv=max-(k/4)*span;grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#F1F5F9"/><text x="${padL-8}" y="${gy+3}" font-size="10" fill="#94A3B8" text-anchor="end">${unit==="€"?eur(gv):dec(gv)}</text>`;}
  // labels X
  let xlab="";const stepLbl=Math.ceil(n/7);for(let i=0;i<n;i+=stepLbl){xlab+=`<text x="${x(i)}" y="${H-12}" font-size="10" fill="#94A3B8" text-anchor="middle">${g.lab(i)}</text>`;}
  let d="M"+x(0)+","+y(pts[0]);pts.forEach((v,i)=>{if(i)d+="L"+x(i)+","+y(v)});
  const last=pts[n-1],lx=x(n-1),ly=y(last);
  const dots=pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#1126FF" opacity="0.5"><title>${g.lab(i)} · ${fmtVal(v,unit)}</title></circle>`).join('');
  return `<svg width="100%" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1126FF" stop-opacity="0.16"/><stop offset="1" stop-color="#1126FF" stop-opacity="0"/></linearGradient></defs>${grid}<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#E7EAF3"/><path d="${d}L${x(n-1)},${H-padB}L${x(0)},${H-padB}Z" fill="url(#tg)"/><path d="${d}" fill="none" stroke="#1126FF" stroke-width="2.4"/>${dots}<circle cx="${lx}" cy="${ly}" r="4" fill="#1126FF"/><text x="${lx-8}" y="${ly-10}" font-size="12" font-weight="800" fill="#0E0484" text-anchor="end">${fmtVal(last,unit)}</text>${xlab}</svg>`;
}

function buildTable(objKey,list){
  const st=tableState[objKey]||(tableState[objKey]={key:"spend",dir:-1});
  const sorted=[...list].sort((a,b)=>{const va=a[st.key]==null?-Infinity:a[st.key],vb=b[st.key]==null?-Infinity:b[st.key];return(va-vb)*st.dir;});

}

/* ---------- KPI card ---------- */
/* delta = variation % vs période précédente ; lowerBetter=true pour CAC/CPM/CPC/fréquence */
function deltaTag(delta,lowerBetter,lead){
  if(delta==null) return "";
  const up=delta>=0, good = lowerBetter ? !up : up;
  const col = lead ? (good?"#BBF7D0":"#FCA5A5") : (good?"var(--green)":"var(--orange)");
  const arrow = up?"▲":"▼";
  const txt=(up?"+":"")+delta.toLocaleString('fr-FR',{maximumFractionDigits:1})+" %";
  return `<span class="delta" style="color:${col}">${arrow} ${txt} <span class="dlab">vs préc.</span></span>`;
}
function kpiCard(lab,val,sub,ref,lead,delta,lowerBetter){
  return `<div class="kpi${lead?' lead':''}"><div class="lab">${lab}</div><div class="val">${val}</div>${deltaTag(delta,lowerBetter,lead)}${sub?`<div class="sub">${sub}</div>`:''}${ref?`<div class="ref">${ref}</div>`:''}</div>`;
}

  const redraw=()=>{document.getElementById('tc-'+objKey).innerHTML=timeChart(objKey,chartState.mk,chartState.mu,chartState.gran);};
  document.querySelectorAll(`.metricsel[data-obj="${objKey}"] button`).forEach(b=>{
    b.onclick=()=>{document.querySelectorAll(`.metricsel[data-obj="${objKey}"] button`).forEach(x=>x.classList.remove('on'));b.classList.add('on');chartState.mk=b.dataset.mk;chartState.mu=b.dataset.mu;redraw();};
  });
  document.querySelectorAll(`.gransel[data-obj="${objKey}"] button`).forEach(b=>{
    if(b.classList.contains('dis'))return;
    b.onclick=()=>{document.querySelectorAll(`.gransel[data-obj="${objKey}"] button`).forEach(x=>x.classList.remove('on'));b.classList.add('on');chartState.gran=b.dataset.gk;redraw();};
  });
}

/* ---------- tri tableau (délégation globale) ---------- */
document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-sort]');
  if(th){const objKey=th.dataset.obj,k=th.dataset.sort,st=tableState[objKey];if(st.key===k)st.dir*=-1;else{st.key=k;st.dir=(k==="cac"||k==="cpm")?1:-1;}renderObjTab(objKey);attachRows();switchTo(objKey);return;}
  const row=e.target.closest('tr.crow');
  if(row){const d=document.querySelector(`[data-detailuid="${row.dataset.uid}"]`);if(d)d.classList.toggle('on');}
});
function attachRows(){}

/* ---------- onglets ---------- */
function buildTabs(){
  const present=[["overview","Overview"]];
  ["acq","noto","rtg"].forEach(k=>{if(CREAS.some(c=>c.obj===k))present.push([k,OBJ[k].label]);});
  document.getElementById('tabs').innerHTML=present.map((t,i)=>{
    const cnt=t[0]==="overview"?CREAS.length:CREAS.filter(c=>c.obj===t[0]).length;
    return `<button class="tab${i===0?' on':''}" data-t="${t[0]}">${t[1]} <span class="dot">${cnt}</span></button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTo(t.dataset.t));
}
function switchTo(key){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===key));
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.dataset.panel===key));
}
/* bascule de période : change le dataset + re-render complet, en restant sur l'onglet courant si possible */
function applyPeriod(p){
  CURRENT_PERIOD=p;CREAS=CREAS_BY_PERIOD[String(p)]||[];
  const cur=document.querySelector('.tab.on');const want=cur?cur.dataset.t:"overview";
  buildTabs();renderOverview();["acq","noto","rtg"].forEach(k=>{if(CREAS.some(c=>c.obj===k))renderObjTab(k);});
  const exists=[...document.querySelectorAll('.tab')].some(t=>t.dataset.t===want);
  switchTo(exists?want:"overview");
}
/* n'active que les boutons de période réellement fournis ; désactive proprement les autres */
document.querySelectorAll('#periodSeg button').forEach(b=>{
  const p=parseInt(b.dataset.p,10),avail=CREAS_BY_PERIOD.hasOwnProperty(String(p));
  b.classList.toggle('on',p===CURRENT_PERIOD);
  if(!avail){b.disabled=true;b.style.opacity="0.4";b.style.cursor="not-allowed";b.title="Période non disponible dans ce rapport";return;}
  b.onclick=()=>{document.querySelectorAll('#periodSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');applyPeriod(p);};
});

/* init : ne rendre que les onglets objectifs présents dans la période par défaut */
buildTabs();renderOverview();["acq","noto","rtg"].forEach(k=>{if(CREAS.some(c=>c.obj===k))renderObjTab(k);});
</script>
